interest:
  provider: manual
  topics:
    - name: AI for Science
      description:  Artificial intelligence and machine learning in protein design, peptide science, biomaterials, hydrogels, and disease diagnostics.
      weight: 1.0
    - name: Complex biological and computational systems
      description: Complex systems, biological networks, intercellular communication, enzymatic networks, reservoir computing, nanowire networks, and DNA computing.
      weight: 1.0
    - name: Conductive polymers and soft electronics
      description: Conducting polymers, polymeric semiconductors, bio-sensors, and flexible organic electronic devices.
      weight: 1.0
    - name: Advanced gels and soft matter
      description: Hydrogels, ionogels, soft matter physics, polymer networks, material defects, and mechanical property optimization.
      weight: 1.0
    - name: Protein and peptide science
      description: Protein engineering, peptide synthesis, structural biology, protein folding, and biomolecular interactions.
      weight: 1.0
    - name: Brain-computer interfaces and neural networks
      description: Brain-computer interfaces (BCI), neural engineering, artificial neural networks, neuroprosthetics, and bio-inspired computing.
      weight: 0.5
    - name: Novel biological mechanisms
      description: Emergent biological mechanisms, cellular signaling pathways, physiological discovery, and novel organisms or tissue functions.
      weight: 0.5
    - name: Biomimetic materials and bio-inspired science
      description: Biomimetic materials, bio-inspired design, smart materials, biomimicry algorithms, and nature-inspired engineering.
      weight: 0.5

email:
  sender: ${oc.env:SENDER}
  receiver: ${oc.env:RECEIVER}
  smtp_server: smtp.qq.com
  smtp_port: 465
  sender_password: ${oc.env:SENDER_PASSWORD}

llm:
  api:
    key: ${oc.env:OPENAI_API_KEY}
    base_url: ${oc.env:OPENAI_API_BASE}
  generation_kwargs:
    model: gpt-4o-mini

source:
  pubmed:
    journals:
      - Nature Chemical Biology
