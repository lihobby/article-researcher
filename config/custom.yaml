interest:
  provider: manual
  topics:
    - name: AI for Science
      description:  Artificial intelligence and machine learning in protein design, peptide science, biomaterials, hydrogels, and disease diagnostics.
      weight: 1.0
    - name: Complex biological and computational systems
      description: Complex systems, biological networks, intercellular communication, enzymatic networks, reservoir computing, nanowire networks, and DNA computing.
      weight: 1.0
    - name: Conductive polymers and soft electronics
      description: Conducting polymers, polymeric semiconductors, bio-sensors, and flexible organic electronic devices.
      weight: 1.0
    - name: Advanced gels and soft matter
      description: Hydrogels, ionogels, soft matter physics, polymer networks, material defects, and mechanical property optimization.
      weight: 1.0
    - name: Protein and peptide science
      description: Protein engineering, peptide synthesis, structural biology, protein folding, and biomolecular interactions.
      weight: 1.0
    - name: Brain-computer interfaces and neural networks
      description: Brain-computer interfaces (BCI), neural engineering, artificial neural networks, neuroprosthetics, and bio-inspired computing.
      weight: 0.5
    - name: Novel biological mechanisms
      description: Emergent biological mechanisms, cellular signaling pathways, physiological discovery, and novel organisms or tissue functions.
      weight: 0.5
    - name: Biomimetic materials and bio-inspired science
      description: Biomimetic materials, bio-inspired design, smart materials, biomimicry algorithms, and nature-inspired engineering.
      weight: 0.5
  negative_topics:
    - name: Unrelated clinical case reports
      description: Single-patient clinical case reports without a new method, material, mechanism, or broadly useful biological insight.
      weight: 1.0
  negative_penalty: 0.5
  matched_topic_count: 3

email:
  sender: ${oc.env:SENDER}
  receiver: ${oc.env:RECEIVER}
  smtp_server: smtp.gmail.com
  smtp_port: 587
  smtp_security: starttls
  sender_password: ${oc.env:SENDER_PASSWORD}
  subject: "个性化科研文献推送 {date}"

llm:
  api:
    key: ${oc.env:GEMINI_API_KEY}
    base_url: https://generativelanguage.googleapis.com/v1beta/openai/
  generation_kwargs:
    model: gemini-flash-latest
    max_tokens: 1200
  language: Chinese
  summary:
    system_prompt: |-
      你是一名严谨的化学、生物学和材料科学文献分析助手。只能依据给出的论文内容作答，不得补充论文中没有的信息；如果某项信息缺失，请明确说明。
    prompt_template: |-
      请用{language}分析下面的论文，并严格使用以下小标题：
      【一句话结论】
      【研究问题】
      【方法】
      【核心发现】
      【创新与价值】说明它为什么与“匹配兴趣”相关
      【局限与阅读建议】
      总长度控制在500字以内，突出定量结果和真正的新意，避免泛泛复述背景。

      标题：{title}
      期刊：{journal}
      发表日期：{publication_date}
      匹配兴趣：{matched_topics}
      摘要：{abstract}
      正文预览：{full_text}

source:
  pubmed:
    journals:
      - Nature Chemical Biology
      - Journal of the American Chemical Society
      - ACS Chemical Biology
      - Cell Chemical Biology
      - Nature Communications
      - Chemical Science
      - Angewandte Chemie International Edition
      - Nature Chemistry
      - Nature Methods
      - Science
      - Nature
      - Cell
      - Nature Machine Intelligence
      - Nature Biomedical Engineering
      - Nature Electronics
      - Nature Computational Science
      - Science Robotics
      - Science Advances
      - Cell Systems
      - Matter
      - Chem
      - Advanced Materials
      - Advanced Functional Materials
      - Advanced Electronic Materials
      - ACS Nano
      - Nano Letters
      - Chemical Reviews
      - Chemical Society Reviews
      - Accounts of Chemical Research
      - Macromolecules
      - Biomacromolecules
      - Progress in Polymer Science
      - Soft Matter
      - Biomaterials
      - Acta Biomaterialia
      - Biofabrication
      - Advanced Healthcare Materials
      - Journal of Neural Engineering
      - IEEE Transactions on Biomedical Engineering
      - Frontiers in Bioengineering and Biotechnology
      - Bioinspiration & Biomimetics
      - Physical Review Letters
      - Physical Review E
      - PNAS
      - Bioinformatics
      - Briefings in Bioinformatics

      
    lookback_days: 3
    email: ${oc.env:NCBI_EMAIL}
    api_key: ${oc.env:NCBI_API_KEY,null}
    max_results: 300
    exclude_article_types: [Editorial, News, Comment, Correction, Retracted Publication]
  arxiv:
    category: [cs.AI, cs.LG, q-bio.BM, q-bio.MN, q-bio.QM, cond-mat.soft]
    include_cross_list: true
  biorxiv:
    category: [biochemistry, bioengineering, bioinformatics, biophysics, synthetic biology]
  medrxiv:
    category: [neurology, health informatics]

executor:
  debug: ${oc.env:DEBUG,null}
  source: [pubmed, biorxiv, medrxiv, arxiv]
  max_paper_num: 30
  min_score: 2.5
  history_path: data/sent_history.json
  history_retention_days: 30
